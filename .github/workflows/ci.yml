name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Lint
        if: always()
        run: npm run lint

      - name: Type-check
        if: always()
        run: npm run typecheck

      - name: Test
        if: always()
        run: npm run test

      - name: Build
        if: always()
        run: npm run build
